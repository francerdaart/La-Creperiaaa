<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Crepería - Menú</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121010;
            color: #f3f4f6;
            margin: 0;
            padding: 20px;
        }
        .header-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #e53935;
            margin-bottom: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        h1 {
            color: #e53935;
            margin: 5px 0;
            font-size: 28px;
        }
        .social-links {
            margin-bottom: 20px;
            text-align: center;
        }
        .social-links a {
            display: inline-block;
            margin: 0 10px;
            color: #f3f4f6;
            text-decoration: none;
            background: #251e1d;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #e53935;
            font-size: 14px;
            font-weight: bold;
        }
        .social-links a:hover {
            background: #e53935;
        }
        .menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .menu-card {
            background: #1e1817;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            border-left: 4px solid #e53935;
        }
        .food-img img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
        }
        .menu-card h3 {
            color: #ff5252;
            margin-top: 10px;
            margin-bottom: 5px;
        }
        .menu-card p {
            color: #d1d5db;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .price {
            color: #4ade80;
            font-weight: bold;
            font-size: 18px;
        }
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .tab {
            background: transparent;
            border: 2px solid #e53935;
            color: #ff5252;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .tab.active, .tab:hover {
            background: #e53935;
            color: white;
        }
        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25d366;
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <img src="https://i.ibb.co/6JVKv8T/Copia-de-Carta-La-Creperia-20260909-122629-0007.jpg" alt="La Creperia Logo" class="logo">
        <h1>LA CREPERIA</h1>
        <div class="social-links">
            <a href="https://instagram.com/lacreperiarc" target="_blank">Instagram: @lacreperiarc</a>
            <a href="https://wa.me/543585702934" target="_blank">📲 Pedidos WhatsApp</a>
        </div>
    </div>
    
    <div class="nav-links">
        <button class="tab active" data-category="crepes-dulces">Crepes dulces</button>
        <button class="tab" data-category="crepes-salados">Crepes salados</button>
        <button class="tab" data-category="panchos">Panchos</button>
        <button class="tab" data-category="bebidas">Bebidas</button>
    </div>

    <div id="menu-grid" class="menu-container"></div>

    <a href="https://wa.me/543585702934" class="whatsapp-float" target="_blank">
        Pedir por WhatsApp
    </a>

    <script>

        },
        {
          "name": "Nutella y Plátano",
          "description": "Nutella con rodajas de plátano.",
          "price": "$9.000"
        },
        {
          "name": "Dulce de Leche",
          "description": "Clásico dulce de leche.",
          "price": "$6.000"
        },
        {
          "name": "Dulce de Leche y Banana",
          "description": "Dulce de leche con rodajas de plátano.",
          "price": "$7.000"
        },
        {
          "name": "ChocoCrep",
          "description": "Mousse de dulce de leche y granos/chispas.",
          "price": "$9.000"
        },
        {
          "name": "Pistacho",
          "description": "Pistacho con chocolate blanco.",
          "price": "$8.000"
        },
        {
          "name": "Combinado",
          "description": "Elegí 2 sabores: Nutella, Pistacho, Dulce de Leche o Chocolate.",
          "price": "$8.000"
        }
      ],
      "crepes-salados": [
        {
          "name": "1",
          "description": "Jamón con queso y huevo.",
          "price": "$9.000",
          "image": "https://i.ibb.co/nNF9sHQF/Copia-de-Carta-La-Creperia-20260909-122628-0000.jpg" 
        },
        {
          "name": "2",
          "description": "Jamón, queso, huevo, rúcula y tomate.",
          "price": "$10.000"
        },
        {
          "name": "3",
          "description": "Panceta, queso, huevo, rúcula y tomate.",
          "price": "$12.000"
        },
        {
          "name": "4",

      ],
      "panchos": [
        {
          "name": "Súper Pancho",
          "description": "Con aderezos a elección + papas.",
          "price": "$3.500",
          "image": "https://i.ibb.co/6JVKv8T/Copia-de-Carta-La-Creperia-20260909-122629-0007.jpg"

      ],
      "bebidas": [
        {

          "description": "Licuado fresco de banana.",

        },
        {

          "description": "Lata de cerveza fría.",
          "price": "$5.000"
        },
        {
          "name": "Cerveza Stella Artois 473ml",
          "description": "Lata de cerveza fría.",
          "price": "$6.000"
        }
      ]
    };

    const grid = document.getElementById("menu-grid");
    const tabs = document.querySelectorAll(".tab");

    function renderMenu(category) {
        grid.innerHTML = menu[category].map(item => `
            <article class="menu-card">
                ${item.image ? `
                    <div class="food-img">
                        <img src="${item.image}" alt="${item.name}">
                    </div>
                ` : ''}
                <div class="menu-info">
                    <h3>${item.name}</h3>
                    <p>${item.description}</p>
                    <span class="price">${item.price}</span>
                </div>
            </article>
        `).join("");
    }

    tabs.forEach(tab => {
        tab.addEventListener("click", () => {
            tabs.forEach(t => t.classList.remove("active"));
            tab.classList.add("active");
            renderMenu(tab.dataset.category);
        });
    });

    renderMenu("crepes-dulces");
    </script>
</body>
</html>
