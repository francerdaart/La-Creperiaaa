<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Crepería | Crepes y Panchos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #0d0b0b;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Navbar Superior */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: #0d0b0b;
            border-bottom: 1px solid #1a1717;
        }
        .logo-text {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .logo-text span {
            color: #e53935;
        }
        .social-header {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .social-header a {
            background: #1a1616;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #333;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
        }
        .social-header a:hover {
            border-color: #e53935;
        }
        
        /* Sección de Inicio */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(rgba(13,11,11,0.85), rgba(13,11,11,0.95)), url('https://i.ibb.co/JPQTQNHK/Screenshot-20260910-232510-Instagram.jpg');
            background-size: cover;
            background-position: center;
        }
        .subtitle-top {
            font-size: 14px;
            color: #e53935;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .hero h1 {
            font-size: 42px;
            line-height: 1.1;
            margin-bottom: 20px;
            font-weight: 800;
        }
        .hero h1 span {
            color: #e53935;
        }
        .hero p {
            color: #b0b0b0;
            font-size: 16px;
            margin-bottom: 30px;
            max-width: 400px;
        }
        .hero-buttons {
            display: flex;
            gap: 15px;
        }
        .btn-cart {
            background-color: #e53935;
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(229,57,53,0.4);
        }
        .btn-outline {
            background-color: transparent;
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid #555;
            cursor: pointer;
        }

        /* Sección de la Carta / Menú */
        .menu-section {
            display: none;
            padding: 30px 20px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }
        .menu-header-text {
            text-align: center;
            margin-bottom: 25px;
        }
        .menu-header-text h4 {
            color: #e53935;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .menu-header-text h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .menu-header-text p {
            color: #999;
            font-size: 14px;
        }

        /* Pestañas de categorías */
        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .tab-btn {
            background-color: #1a1616;
            color: #ffffff;
            border: 1px solid #333;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background-color: #0d0b0b;
            border: 1px solid #262020;
        }

        /* Grilla del Menú */
        .grid-menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .card {
            background: #161313;
            border: 1px solid #262020;
            border-radius: 12px;
            display: flex;
            overflow: hidden;
            align-items: center;
        }
        .card-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-right: 1px solid #262020;
            flex-shrink: 0;
        }
        .card-content {
            padding: 15px;
            flex: 1;
        }
        .card h3 {
            font-size: 18px;
            margin-bottom: 6px;
            color: #ffffff;
        }
        .card p {
            color: #aaaaaa;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .card .price {
            color: #aade80;
            font-weight: bold;
            font-size: 16px;
        }
        .back-home {
            text-align: center;
            margin-top: 30px;
        }
        .back-home button {
            background: none;
            border: none;
            color: #e53935;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Barra Superior -->
    <header>
        <div class="logo-text">LA <span>CREPERIA</span></div>
        <div class="social-header">
            <a href="https://instagram.com/lacreperiarc" target="_blank">📸 @lacreperiarc</a>
            <a href="https://wa.me/543585702934" target="_blank">💬 WhatsApp</a>
        </div>
    </header>

    <!-- Pantalla de Inicio (Hero) -->
    <section id="home-view" class="hero">
        <div class="subtitle-top"> CREPES • PANCHOS</div>
        <h1>Algo rico<br><span>te está</span><br>esperando.</h1>
        <p>Bienvenidos a La Crepería. Elegí tu favorito y disfrutá.</p>
        <div class="hero-buttons">
            <button class="btn-cart" onclick="mostrarCarta('crepes-dulces')">Ver la carta</button>
            <a href="https://wa.me/543585702934?text=Hola%20quiero%20hacer%20un%20pedido" target="_blank" class="btn-outline">Hacer un pedido</a>
        </div>
    </section>

    <!-- Sección del Menú / Carta -->
    <section id="menu-section" class="menu-section">
        <div class="menu-header-text">
            <h4>LA CARTA</h4>
            <h2>Elegí entre nuestras opciones dulces, saladas, panchos y bebidas.</h2>
        </div>
        
        <div class="category-tabs">
            <button class="tab-btn active" onclick="filtrar('crepes-dulces', this)">Crepes Dulces</button>
            <button class="tab-btn" onclick="filtrar('crepes-salados', this)">Crepes Salados</button>
            <button class="tab-btn" onclick="filtrar('panchos', this)">Panchos</button>
            <button class="tab-btn" onclick="filtrar('bebidas', this)">Bebidas</button>
        </div>

        <div id="grid-menu" class="grid-menu"></div>

        <div class="back-home">
            <button onclick="volverInicio()">← Volver al inicio</button>
        </div>
    </section>

    <script>
        const menu = {
          "crepes-dulces": [
            { "name": "1", "description": "Crepe relleno de pura Nutella.", "price": "$8.000", "image": "https://i.ibb.co/hx2WFTSX/Dividida-1-2-20260911-182228-0010.jpg" },
            { "name": "2", "description": "Nutella con frutillas.", "price": "$9.000", "image": "https://i.ibb.co/XrWTf043/Dividida-2-2-20260911-182228-0011.jpg" },
            { "name": "3", "description": "Nutella con rodajas de banana.", "price": "$9.000", "image": "https://i.ibb.co/vCKqZkZ0/Dividida-3-2-20260911-182228-0012.jpg" },
            { "name": "4", "description": "dulce de leche.", "price": "$6.000", "image": "https://i.ibb.co/vt6FHzS/Dividida-4-2-20260911-182229-0013.jpg" },
            { "name": "5", "description": "Dulce de leche con rodajas de banana.", "price": "$7.000", "image": "https://i.ibb.co/NgWWCM4W/Dividida-5-2-20260911-182229-0014.jpg" },
            { "name": "6", "description": "Mezcla de dulce de leche y queso crema + chocolinas.", "price": "$9.000", "image": "https://i.ibb.co/KxW3Z0Vk/Dividida-6-2-20260911-182229-0015.jpg" },
            { "name": "7", "description": "Pistacho con chocolate blanco.", "price": "$8.000", "image": "https://i.ibb.co/ccj49M0p/Dividida-7-2-20260911-182229-0016.jpg" },
            { "name": "8", "description": "Elegí 2 sabores: Nutella, Pistacho, Dulce de Leche o Chocolate.", "price": "$8.000" }
          ],
          "crepes-salados": [
            { "name": "1", "description": "Jamón con queso y huevo.", "price": "$9.000", "image": "https://i.ibb.co/TBcv5Z81/Copia-de-Carta-La-Creperia-20260909-122628-0000.jpg" },
            { "name": "2", "description": "Jamón, queso, huevo, rúcula y tomate.", "price": "$10.000", "image": "https://i.ibb.co/m5Nn7w7p/Copia-de-Carta-La-Creperia-20260909-122628-0001.jpg" },
            { "name": "3", "description": "Panceta, queso, huevo, rúcula y tomate.", "price": "$12.000", "image": "https://i.ibb.co/tw7gN6WR/Copia-de-Carta-La-Creperia-20260909-122628-0002.jpg" },
            { "name": "4", "description": "Jamón crudo, queso, rúcula, palta y tomate seco.", "price": "$12.000", "image": "https://i.ibb.co/nqv3gXRR/Copia-de-Carta-La-Creperia-20260909-122628-0003.jpg" },
            { "name": "5", "description": "Pollo, cebolla, cebolla de verdeo, pimientos y queso.", "price": "$10.000", "image": "https://i.ibb.co/CK4FVhzL/Copia-de-Carta-La-Creperia-20260909-122629-0004.jpg" },
            { "name": "6", "description": "Champiñones, cebolla de verdeo, crema y queso.", "price": "$12.000", "image": "https://i.ibb.co/1HvPbj3/Copia-de-Carta-La-Creperia-20260909-122629-0005.jpg" },
            { "name": "7", "description": "Bondiola, cebolla, cebolla de verdeo, pimientos y queso.", "price": "$12.000", "image": "https://i.ibb.co/bMRv802H/Copia-de-Carta-La-Creperia-20260909-122629-0006.jpg" }
          ],
          "panchos": [
            { "name": "Súper Pancho", "description": "Con aderezos a elección + papas.", "price": "$3.500", "image": "https://i.ibb.co/HfcqXFH3/Copia-de-Carta-La-Creperia-20260909-122629-0007.jpg" }
          ],
          "bebidas": [
            { "name": "Gaseosa 500ml", "description": "Línea Coca-Cola / Variedad.", "price": "$2.500" },
            { "name": "Agua sin gas 500ml", "description": "Agua mineral.", "price": "$2.500" },
            { "name": "Licuado de Frutilla 500ml", "description": "Licuado fresco de frutilla.", "price": "$5.000" },
            { "name": "Licuado de Banana 500ml", "description": "Licuado fresco de banana.", "price": "$5.000" },
            { "name": "Cerveza Andes Rubia 473ml", "description": "Lata de cerveza fría.", "price": "$5.000" },
            { "name": "Cerveza Stella Artois 473ml", "description": "Lata de cerveza fría.", "price": "$6.000" }
          ]
        };

        function mostrarCarta(categoria) {
            document.getElementById("home-view").style.display = "none";
            document.getElementById("menu-section").style.display = "block";
            
            const botones = document.querySelectorAll(".tab-btn");
            botones.forEach(b => b.classList.remove("active"));
            
            if (categoria === 'crepes-dulces') botones[0].classList.add('active');
            
            renderizar(categoria);
            window.scrollTo(0, 0);
        }

        function volverInicio() {
            document.getElementById("menu-section").style.display = "none";
            document.getElementById("home-view").style.display = "flex";
            window.scrollTo(0, 0);
        }

        function filtrar(categoria, elemento) {
            document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove('active'));
            elemento.classList.add('active');
            renderizar(categoria);
        }

        function renderizar(cat) {
            const grid = document.getElementById("grid-menu");
            grid.innerHTML = menu[cat].map(item => `
                <div class="card">
                    ${item.image ? `<img src="${item.image}" alt="${item.name}" class="card-img">` : ''}
                    <div class="card-content">
                        <h3>${item.name}</h3>
                        <p>${item.description}</p>
                        <div class="price">${item.price}</div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
