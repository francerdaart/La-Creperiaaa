<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Crepería | Crepes y Panchos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #0d0b0b;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Navbar Superior */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: #0d0b0b;
            border-bottom: 1px solid #1a1717;
        }
        .logo-text {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .logo-text span {
            color: #e53935;
        }
        .menu-icon {
            font-size: 24px;
            cursor: pointer;
            color: #ffffff;
        }

        /* Sección de Inicio / Bienvenida */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(rgba(13,11,11,0.85), rgba(13,11,11,0.95)), url('https://i.ibb.co/6JVKv8T/Copia-de-Carta-La-Creperia-20260909-122629-0007.jpg');
            background-size: cover;
            background-position: center;
        }
        .subtitle-top {
            font-size: 14px;
            color: #e53935;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .hero h1 {
            font-size: 42px;
            line-height: 1.1;
            margin-bottom: 20px;
            font-weight: 800;
        }
        .hero h1 span {
            color: #e53935;
        }
        .hero p {
            color: #b0b0b0;
            font-size: 16px;
            margin-bottom: 30px;
            max-width: 400px;
        }
        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-red {
            background-color: #e53935;
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(229,57,53,0.4);
        }
        .btn-outline {
            background-color: transparent;
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid #555;
            cursor: pointer;
        }

        /* Sección de la Carta / Menú (Oculta al inicio hasta que eligen ver carta) */
        .menu-section {
            display: none;
            padding: 30px 20px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }
        .menu-header-text {
            text-align: center;
            margin-bottom: 25px;
        }
        .menu-header-text h4 {
            color: #e53935;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .menu-header-text h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .menu-header-text p {
            color: #999;
            font-size: 14px;
        }

        /* Pestañas de categorías estilo la foto */
        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .tab-btn {
            background-color: #1a1616;
            color: #ffffff;
            border: 1px solid #333;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background-color: #ffffff;
            color: #0d0b0b;
            border-color: #ffffff;
        }

        /* Grilla de productos */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #161212;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #262020;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .card h3 {
            font-size: 18px;
            margin-bottom: 6px;
            color: #ffffff;
        }
        .card p {
            color: #aaaaaa;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .card .price {
            color: #4ade80;
            font-weight: bold;
            font-size: 16px;
        }

        .back-home {
            text-align: center;
            margin-bottom: 20px;
        }
        .back-home button {
            background: none;
            border: none;
            color: #e53935;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-text">LA <span>CREPERIA</span></div>
        <div class="menu-icon" onclick="irAlInicio()">☰</div>
    </header>

    <section id="home-view" class="hero">
        <div class="subtitle-top">🥞 CREPES • 🌭 PANCHOS</div>
        <h1>Algo rico<br><span>te está</span><br>esperando.</h1>
        <p>Bienvenidos a La Creperia. Elegí tu favorito y disfrutá.</p>
        <div class="hero-buttons">
            <button class="btn-red" onclick="mostrarCarta('crepes-dulces')">Ver la carta</button>
            <a href="https://wa.me/543585702934?text=Hola!%20Quiero%20hacer%20un%20pedido" class="btn-outline" target="_blank">Hacer un pedido</a>
        </div>
    </section>

    <section id="menu-view" class="menu-section">
        <div class="back-home">
            <button onclick="irAlInicio()">← Volver al inicio</button>
        </div>
        <div class="menu-header-text">
            <h4>NUESTRO MENÚ</h4>
            <h2>La carta</h2>
            <p>Elegí entre nuestras opciones dulces, saladas, panchos y bebidas.</p>
        </div>

        <div class="category-tabs">
            <button class="tab-btn active" onclick="filtrar('crepes-dulces', this)">Crepes dulces</button>
            <button class="tab-btn" onclick="filtrar('crepes-salados', this)">Crepes salados</button>
            <button class="tab-btn" onclick="filtrar('panchos', this)">Panchos</button>
            <button class="tab-btn" onclick="filtrar('bebidas', this)">Bebidas</button>
        </div>

        <div id="grid-menu" class="grid-container"></div>
    </section>

    <script>
    const menu = {
      "crepes-dulces": [
        { "name": "Nutella", "description": "Crepe relleno de pura Nutella.", "price": "$8.000", "image": "https://i.ibb.co/bM7q9307/nutella-limpia" },
        { "name": "Nutella y Frutillas", "description": "Nutella con frutillas frescas.", "price": "$9.000", "image": "https://i.ibb.co/h1W7d6n7/nutellayfruti" },
        { "name": "Nutella y Plátano", "description": "Nutella con rodajas de plátano.", "price": "$9.000" },
        { "name": "Dulce de Leche", "description": "Clásico dulce de leche.", "price": "$6.000" },
        { "name": "Dulce de Leche y Banana", "description": "Dulce de leche con rodajas de plátano.", "price": "$7.000" },
        { "name": "ChocoCrep", "description": "Mousse de dulce de leche y granos/chispas.", "price": "$9.000" },
        { "name": "Pistacho", "description": "Pistacho con chocolate blanco.", "price": "$8.000" },
        { "name": "Combinado", "description": "Elegí 2 sabores: Nutella, Pistacho, Dulce de Leche o Chocolate.", "price": "$8.000" }
      ],
      "crepes-salados": [
        { "name": "1", "description": "Jamón con queso y huevo.", "price": "$9.000" },
        { "name": "2", "description": "Jamón, queso, huevo, rúcula y tomate.", "price": "$10.000" },
        { "name": "3", "description": "Panceta, queso, huevo, rúcula y tomate.", "price": "$12.000" },
        { "name": "4", "description": "Jamón crudo, queso, rúcula, palta y tomate seco.", "price": "$12.000" },
        { "name": "5", "description": "Pollo, cebolla, cebolla de verdeo, pimientos y queso.", "price": "$10.000" },
        { "name": "6", "description": "Champiñones, cebolla de verdeo, crema y queso.", "price": "$12.000" },
        { "name": "7", "description": "Bondiola, cebolla, cebolla de verdeo, pimientos y queso.", "price": "$12.000" }
      ],
      "panchos": [
        { "name": "Súper Pancho", "description": "Con aderezos a elección + papas.", "price": "$3.500", "image": "https://i.ibb.co/6JVKv8T/Copia-de-Carta-La-Creperia-20260909-122629-0007.jpg" }
      ],
      "bebidas": [
        { "name": "Gaseosa 500ml", "description": "Línea Coca-Cola / Variedad.", "price": "$2.500" },
        { "name": "Agua sin gas 500ml", "description": "Agua mineral.", "price": "$2.500" },
        { "name": "Licuado de Frutilla 500ml", "description": "Licuado fresco de frutilla.", "price": "$5.000" },
        { "name": "Licuado de Banana 500ml", "description": "Licuado fresco de banana.", "price": "$5.000" },
        { "name": "Cerveza Andes Rubia 473ml", "description": "Lata de cerveza fría.", "price": "$5.000" },
        { "name": "Cerveza Stella Artois 473ml", "description": "Lata de cerveza fría.", "price": "$6.000" }
      ]
    };

    function mostrarCarta(categoria) {
        document.getElementById('home-view').style.display = 'none';
        document.getElementById('menu-view').style.display = 'block';
        
        // Activar el botón correspondiente
        const botones = document.querySelectorAll('.tab-btn');
        botones.forEach(b => b.classList.remove('active'));
        
        // Buscar el botón de la categoría activa
        if(categoria === 'crepes-dulces') botones[0].classList.add('active');
        if(categoria === 'crepes-salados') botones[1].classList.add('active');
        if(categoria === 'panchos') botones[2].classList.add('active');
        if(categoria === 'bebidas') botones[3].classList.add('active');

        renderizar(categoria);
    }

    function irAlInicio() {
        document.getElementById('menu-view').style.display = 'none';
        document.getElementById('home-view').style.display = 'flex';
    }

    function filtrar(categoria, elemento) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        elemento.classList.add('active');
        renderizar(categoria);
    }

    function renderizar(cat) {
        const grid = document.getElementById('grid-menu');
        grid.innerHTML = menu[cat].map(item => `
            <div class="card">
                ${item.image ? `<img src="${item.image}" alt="${item.name}">` : ''}
                <div>
                    <h3>${item.name}</h3>
                    <p>${item.description}</p>
                </div>
                <div class="price">${item.price}</div>
            </div>
        `).join('');
    }
    </script>
</body>
</html>
